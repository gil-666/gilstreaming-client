name: GilStreaming builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinator:
    name: Coordinator - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2025
            output: gilstreaming-coordinator.exe
            artifactPath: dist/coordinator-package
          - name: Linux-x64
            os: ubuntu-24.04
            output: gilstreaming-coordinator
            artifactPath: dist/GilStreaming-Coordinator-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: coordinator/go.mod
          cache-dependency-path: coordinator/go.sum

      - name: Test coordinator
        working-directory: coordinator
        run: go test -count=1 ./...

      - name: Build coordinator
        shell: bash
        working-directory: coordinator
        run: |
          mkdir -p ../dist/coordinator-package
          go build -trimpath -o "../dist/coordinator-package/${{ matrix.output }}" .
          cp config.example.json .env.example README.md ../dist/coordinator-package/

      - name: Add Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item coordinator\start-coordinator.ps1 dist\coordinator-package\

      - name: Package Linux coordinator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp coordinator/start-coordinator.sh dist/coordinator-package/
          chmod +x dist/coordinator-package/gilstreaming-coordinator \
            dist/coordinator-package/start-coordinator.sh
          tar -C dist/coordinator-package -czf dist/GilStreaming-Coordinator-Linux-x64.tar.gz .

      - name: Upload coordinator
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Coordinator-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14

  windows-client:
    name: Windows client - ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

      - name: Build client
        shell: pwsh
        run: .\scripts\build-client.ps1 -Configuration ${{ matrix.configuration }}

      - name: Create runnable directory
        shell: pwsh
        run: |
          $configuration = "${{ matrix.configuration }}".ToLowerInvariant()
          $build = Join-Path $PWD "build\build-x64-$configuration"
          $source = Join-Path $build "app\$configuration\GilStreaming.exe"
          $destination = Join-Path $PWD "dist\client-windows-$configuration"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination
          Copy-Item "libs\windows\lib\x64\*.dll" -Destination $destination
          Copy-Item (Join-Path $build "AntiHooking\$configuration\AntiHooking.dll") -Destination $destination
          Copy-Item "app\SDL_GameControllerDB\gamecontrollerdb.txt" -Destination $destination
          windeployqt --$configuration --qmldir app\gui --no-opengl-sw --no-sql --dir $destination $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows client
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Windows-x64-${{ matrix.configuration }}-${{ github.sha }}
          path: dist/client-windows-*
          if-no-files-found: error
          retention-days: 14

  linux-client:
    name: Linux client - ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential qmake6 qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick \
            libegl1-mesa-dev libgl1-mesa-dev libopus-dev libsdl2-dev \
            libsdl2-ttf-dev libssl-dev libavcodec-dev libavformat-dev \
            libswscale-dev libva-dev libvdpau-dev libxkbcommon-dev \
            wayland-protocols libdrm-dev libpulse-dev libasound2-dev

      - name: Build client
        run: bash scripts/build-client.sh ${{ matrix.configuration }}

      - name: Archive Linux client
        run: |
          mkdir -p dist
          tar -C "build/build-linux-${{ matrix.configuration }}/app" \
            -czf "dist/GilStreaming-Linux-x64-${{ matrix.configuration }}.tar.gz" gilstreaming

      - name: Upload Linux client
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Linux-x64-${{ matrix.configuration }}-${{ github.sha }}
          path: dist/GilStreaming-Linux-x64-${{ matrix.configuration }}.tar.gz
          if-no-files-found: error
          retention-days: 14

name: GilStreaming builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gilstreaming-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinator:
    name: Coordinator - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2025
            output: gilstreaming-coordinator.exe
            artifactPath: dist/coordinator-package
          - name: Linux-x64
            os: ubuntu-24.04
            output: gilstreaming-coordinator
            artifactPath: dist/GilStreaming-Coordinator-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: coordinator/go.mod
          cache-dependency-path: coordinator/go.sum

      - name: Test coordinator
        working-directory: coordinator
        run: go test -count=1 ./...

      - name: Build coordinator
        shell: bash
        working-directory: coordinator
        run: |
          mkdir -p ../dist/coordinator-package
          go build -trimpath -o "../dist/coordinator-package/${{ matrix.output }}" .
          cp config.example.json .env.example README.md ../dist/coordinator-package/

      - name: Add Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item coordinator\start-coordinator.ps1 dist\coordinator-package\

      - name: Package Linux coordinator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp coordinator/start-coordinator.sh dist/coordinator-package/
          chmod +x dist/coordinator-package/gilstreaming-coordinator \
            dist/coordinator-package/start-coordinator.sh
          tar -C dist/coordinator-package -czf dist/GilStreaming-Coordinator-Linux-x64.tar.gz .

      - name: Upload coordinator
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Coordinator-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14

  windows-client:
    name: Windows client - ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

      - name: Set continuous build version
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $versionParts = (Get-Content -LiteralPath app\version.txt -Raw).Trim().Split('.')
          if ($versionParts.Count -lt 2) { throw "app/version.txt must contain at least major.minor." }
          $ciVersion = "$($versionParts[0]).$($versionParts[1]).${{ github.run_number }}"
          Set-Content -LiteralPath app\version.txt -Value $ciVersion -NoNewline
          "CI_VERSION=$ciVersion" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build client
        shell: pwsh
        run: .\scripts\build-client.ps1 -Configuration ${{ matrix.configuration }}

      - name: Create runnable directory
        shell: pwsh
        run: |
          $configuration = "${{ matrix.configuration }}".ToLowerInvariant()
          $build = Join-Path $PWD "build\build-x64-$configuration"
          $source = Join-Path $build "app\$configuration\GilStreaming.exe"
          $destination = Join-Path $PWD "dist\client-windows-$configuration"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination
          Copy-Item "libs\windows\lib\x64\*.dll" -Destination $destination
          Copy-Item (Join-Path $build "AntiHooking\$configuration\AntiHooking.dll") -Destination $destination
          Copy-Item "app\SDL_GameControllerDB\gamecontrollerdb.txt" -Destination $destination
          windeployqt --$configuration --qmldir app\gui --no-opengl-sw --no-sql --dir $destination $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows client
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Windows-x64-${{ matrix.configuration }}-${{ github.sha }}
          path: dist/client-windows-*
          if-no-files-found: error
          retention-days: 14

      - name: Build branded Windows installer
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $buildRoot = Join-Path $PWD "build"
          $buildFolder = Join-Path $buildRoot "build-x64-release"
          $runnableFolder = Join-Path $PWD "dist\client-windows-release"
          $payloadFolder = Join-Path $PWD "dist\installer-payload"
          $installerFolder = Join-Path $buildRoot "installer-release"

          New-Item -ItemType Directory -Force -Path $payloadFolder, $installerFolder | Out-Null
          Get-ChildItem -LiteralPath $runnableFolder |
            Where-Object Name -ne "GilStreaming.exe" |
            Copy-Item -Destination $payloadFolder -Recurse

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found." }

          $Env:BUILD_ROOT = $buildRoot
          $Env:BUILD_FOLDER = $buildFolder
          $Env:BUILD_CONFIG = "release"
          $Env:DEPLOY_FOLDER = $payloadFolder
          $Env:INSTALLER_FOLDER = $installerFolder

          & $msbuild -Restore wix\Moonlight\Moonlight.wixproj `
            /p:Configuration=release /p:Platform=x64 `
            "/p:MSBuildProjectExtensionsPath=$buildRoot\wix-product-obj\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $msbuild -Restore wix\GilStreamingSetup\GilStreamingSetup.wixproj `
            /p:Configuration=release /p:Platform=x64 `
            "/p:MSBuildProjectExtensionsPath=$buildRoot\wix-bundle-obj\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Join-Path $installerFolder "GilStreamingSetup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer build succeeded but $installer was not produced."
          }

          $publishFolder = Join-Path $PWD "dist\continuous-release"
          New-Item -ItemType Directory -Force -Path $publishFolder | Out-Null
          Copy-Item -LiteralPath $installer `
            -Destination (Join-Path $publishFolder "GilStreamingSetup-x64.exe")

          @(
            [ordered]@{
              platform = "windows"
              arch = "x86_64"
              version = $Env:CI_VERSION
              browser_url = "https://github.com/gil-666/gilstreaming-client/releases/download/continuous/GilStreamingSetup-x64.exe"
            }
          ) | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $publishFolder "update.json") -Encoding utf8NoBOM

      - name: Upload Windows installer
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Windows-Installer-${{ github.sha }}
          path: dist/continuous-release/*
          if-no-files-found: error
          retention-days: 14

  linux-client:
    name: Linux client - ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential qmake6 qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick \
            libegl1-mesa-dev libgl1-mesa-dev libopus-dev libsdl2-dev \
            libsdl2-ttf-dev libssl-dev libavcodec-dev libavformat-dev \
            libswscale-dev libva-dev libvdpau-dev libxkbcommon-dev \
            wayland-protocols libdrm-dev libpulse-dev libasound2-dev

      - name: Build client
        run: bash scripts/build-client.sh ${{ matrix.configuration }}

      - name: Archive Linux client
        run: |
          mkdir -p dist
          tar -C "build/build-linux-${{ matrix.configuration }}/app" \
            -czf "dist/GilStreaming-Linux-x64-${{ matrix.configuration }}.tar.gz" gilstreaming

      - name: Upload Linux client
        uses: actions/upload-artifact@v6
        with:
          name: GilStreaming-Linux-x64-${{ matrix.configuration }}-${{ github.sha }}
          path: dist/GilStreaming-Linux-x64-${{ matrix.configuration }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-continuous:
    name: Publish latest successful build
    needs: [coordinator, windows-client, linux-client]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download installer from this build
        uses: actions/download-artifact@v7
        with:
          name: GilStreaming-Windows-Installer-${{ github.sha }}
          path: dist

      - name: Publish rolling continuous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          notes="Built from ${GITHUB_SHA} by successful GitHub Actions run ${GITHUB_RUN_NUMBER}."
          if gh release view continuous >/dev/null 2>&1; then
            gh release upload continuous \
              dist/GilStreamingSetup-x64.exe dist/update.json --clobber
            gh release edit continuous \
              --target "$GITHUB_SHA" \
              --title "GilStreaming continuous build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          else
            gh release create continuous \
              dist/GilStreamingSetup-x64.exe dist/update.json \
              --target "$GITHUB_SHA" \
              --title "GilStreaming continuous build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
